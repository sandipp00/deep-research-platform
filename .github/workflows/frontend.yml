name: frontend

on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

permissions:
  id-token: write   # OIDC -> AWS
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci

      # `lint` is tsc --noEmit today (see frontend/package.json) — catches
      # exactly the kind of type errors that shipped in past changes here.
      - run: cd frontend && npm run lint
      - run: cd frontend && npm run build

      - if: github.ref == 'refs/heads/main' && vars.ECR_REGISTRY != ''
        name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - if: github.ref == 'refs/heads/main' && vars.ECR_REGISTRY != ''
        name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - if: github.ref == 'refs/heads/main' && vars.ECR_REGISTRY != ''
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ vars.ECR_REGISTRY }}/lumen-frontend:${{ github.sha }}
            ${{ vars.ECR_REGISTRY }}/lumen-frontend:latest
