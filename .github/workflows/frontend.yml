name: frontend

on:
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]

permissions:
  id-token: write   # OIDC -> AWS
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci
      - run: cd frontend && npm run lint

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: cd frontend && npm run build

      - if: github.ref == 'refs/heads/main' && vars.S3_BUCKET != ''
        name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Deploys straight to the live S3 bucket behind CloudFront
      # (see EC2 + S3/CloudFront deployment note in docs/) - not ECS/ECR.
      - if: github.ref == 'refs/heads/main' && vars.S3_BUCKET != ''
        name: Sync to S3
        run: aws s3 sync frontend/dist s3://${{ vars.S3_BUCKET }} --delete

      - if: github.ref == 'refs/heads/main' && vars.CF_DISTRIBUTION_ID != ''
        name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CF_DISTRIBUTION_ID }} \
            --paths "/*"
