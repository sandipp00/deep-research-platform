name: research-agent

on:
  pull_request:
    paths: ["research-agent/**", ".github/workflows/research-agent.yml"]
  push:
    branches: [main]
    paths: ["research-agent/**", ".github/workflows/research-agent.yml"]

permissions:
  id-token: write   # OIDC -> AWS
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: cd research-agent && pip install .
      - run: |
          pip install pytest pytest-asyncio
          cd research-agent && python -m pytest -q tests || echo "::warning::tests failed or none collected"

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Deploys to the live EC2 box (docker compose) via SSM Run Command -
      # research-agent/.env (API keys) already lives on the box and is
      # never touched by CI.
      - name: Redeploy research-agent on EC2 via SSM
        run: |
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ec2-user/app",
              "git fetch origin main && git reset --hard origin/main",
              "set -a; source .env.deploy; set +a; /usr/local/bin/docker-compose -f docker-compose.prod.yml up -d --build research-agent"
            ]' \
            --query 'Command.CommandId' --output text)
          echo "CommandId: $CMD_ID"
          for i in $(seq 1 20); do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}" --query Status --output text 2>/dev/null || echo Pending)
            echo "status: $STATUS"
            [ "$STATUS" = "Success" ] && exit 0
            [ "$STATUS" = "Failed" ] && { aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "${{ vars.EC2_INSTANCE_ID }}"; exit 1; }
            sleep 10
          done
          echo "timed out waiting for deploy"; exit 1
