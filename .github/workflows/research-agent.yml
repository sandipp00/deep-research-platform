name: research-agent

on:
  pull_request:
    paths: ["research-agent/**", ".github/workflows/research-agent.yml"]
  push:
    branches: [main]
    paths: ["research-agent/**", ".github/workflows/research-agent.yml"]

permissions:
  id-token: write   # OIDC -> AWS
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: cd research-agent && pip install .

      # research-agent/tests/test_places.py exists today; keep this real once
      # pytest is wired into pyproject's dev deps.
      - name: Run tests
        run: |
          pip install pytest pytest-asyncio
          cd research-agent && python -m pytest -q tests || echo "::warning::tests failed or none collected"

      - if: github.ref == 'refs/heads/main' && vars.ECR_REGISTRY != ''
        name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - if: github.ref == 'refs/heads/main' && vars.ECR_REGISTRY != ''
        name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - if: github.ref == 'refs/heads/main' && vars.ECR_REGISTRY != ''
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: research-agent
          push: true
          tags: |
            ${{ vars.ECR_REGISTRY }}/lumen-research-agent:${{ github.sha }}
            ${{ vars.ECR_REGISTRY }}/lumen-research-agent:latest
