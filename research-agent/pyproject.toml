[project]
name = "alvoff-assistant-research-agent"
version = "0.1.20"
description = "Research agent HTTP/SSE service"
readme = "README.md"
authors = [{ name = "tipstat", email = "anirudh@tipstat.com" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.42.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "python-dotenv>=1.1.0",
    "openai>=1.50.0",
    "langchain-openai>=1.0.0",
    "langchain-core>=1.0.0",
    "langchain>=1.0.0",
    "langgraph>=1.0.0",
    "deepagents>=0.5.3",
    "redis>=6.0.0",
    "httpx>=0.28.1",
    "octen>=0.9.0",
    "duckduckgo-search>=6.0.0",
    "yfinance>=0.2.0",
    "feedparser>=6.0.0",
    "wikipedia-api>=0.16.0",
    "pymupdf>=1.24.0",
    "prometheus-fastapi-instrumentator>=7.0.2",
    "coloredlogs>=15.0.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.26.0",
]

[project.scripts]
api = "research_agent:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
