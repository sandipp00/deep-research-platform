[project]
name = "alvoff-assistant-research-agent"
version = "0.1.20"
description = "Research agent — HTTP/SSE service using Deep Agents for open-ended research queries"
readme = "README.md"
authors = [{ name = "tipstat", email = "anirudh@tipstat.com" }]
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi>=0.135.0",
    "uvicorn[standard]>=0.42.0",
    # Config
    "pydantic>=2.12.0",
    "pydantic-settings>=2.13.0",
    "python-dotenv>=1.1.0",
    # LLM
    "langchain-openai>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    # Deep Agents
    "deepagents>=0.5.3",
    # Redis
    "redis>=6.0.0",
    # HTTP client
    "httpx>=0.28.1",
    # Search tools
    "exa-py>=1.0.0",
    "duckduckgo-search>=6.0.0",
    # Data tools
    "yfinance>=0.2.0",
    "feedparser>=6.0.0",
    "wikipedia-api>=0.6.0",
    "pymupdf>=1.24.0",
    # Observability
    "prometheus-fastapi-instrumentator>=7.0.2",
    "coloredlogs>=15.0.1",
]

[project.scripts]
api = "research_agent:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/research_agent"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
