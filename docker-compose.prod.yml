services:
  postgres:
    image: postgres:16-alpine
    container_name: lumen-postgres
    restart: unless-stopped
    mem_limit: 160m
    environment:
      POSTGRES_DB: lumen
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30", "-c", "effective_cache_size=128MB", "-c", "work_mem=2MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumen"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: alvoff-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  research-agent:
    build:
      context: ./research-agent
      dockerfile: Dockerfile
    container_name: alvoff-research-agent
    restart: unless-stopped
    env_file:
      - ./research-agent/.env
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 8004
    depends_on:
      redis:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alvoff-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      RESEARCH_AGENT_URL: http://research-agent:8004
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MINUTES: 1440
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      research-agent:
        condition: service_started

volumes:
  pgdata:
