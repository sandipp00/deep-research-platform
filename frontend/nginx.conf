server {
    listen 8081;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — client-side router handles the path
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: long cache, content-hashed filenames from Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
