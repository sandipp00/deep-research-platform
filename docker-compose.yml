services:
  postgres:
    image: postgres:16-alpine
    container_name: alvoff-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: alvoff
      POSTGRES_USER: alvoff
      POSTGRES_PASSWORD: alvoff
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alvoff -d alvoff"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: alvoff-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  research-agent:
    build:
      context: ./research-agent
      dockerfile: Dockerfile
    container_name: alvoff-research-agent
    restart: unless-stopped
    env_file:
      - ./research-agent/.env
    environment:
      REDIS_URL: redis://redis:6379
      PORT: 8004
    ports:
      - "8004:8004"
    depends_on:
      redis:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alvoff-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://alvoff:alvoff@postgres:5432/alvoff
      RESEARCH_AGENT_URL: http://research-agent:8004
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod-use-a-long-random-string-at-least-32-bytes}
      JWT_EXPIRATION_MINUTES: 1440
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      research-agent:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
