spring:
  application:
    name: alvoff-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alvoff}
    username: ${SPRING_DATASOURCE_USERNAME:alvoff}
    password: ${SPRING_DATASOURCE_PASSWORD:alvoff}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.lob.non_contextual_creation: true
    open-in-view: false
  mvc:
    async:
      request-timeout: 600000  # 10 min for long-running SSE streams

server:
  port: 8080
  compression:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-prod-use-a-long-random-string-at-least-32-bytes}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  research-agent:
    url: ${RESEARCH_AGENT_URL:http://localhost:8004}

logging:
  level:
    ai.alvoff: INFO
    org.springframework.security: INFO
